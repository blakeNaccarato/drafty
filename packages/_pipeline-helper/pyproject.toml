[build-system]
requires = ["uv-build==0.11.11"]
build-backend = "uv_build"
[tool.uv.build-backend]
module-root = "."

[project]
name = "pipeline-helper"
version = "0.0.0"
description = "Data pipeline helper"
dependencies = [
  "cappa>=0.22.4",
  "dulwich>=0.23.0",
  "ipython>=8.26.0",
  "more-itertools>=10.4.0",
  "pandas>=3.0.3",
  "pint>=0.24.4",
  "pydantic-settings>=2.5.2",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.2",
]

[tool.fawltydeps]
deps = ["packages/_pipeline-helper/pyproject.toml"]
code = ["packages/_pipeline-helper/src"]
ignore_undeclared = ["drafty", "drafty_dev", "drafty_pipeline", "pipeline_helper"]
